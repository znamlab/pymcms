[project]
name = "pymcms"
version = "0.3.0"
authors = [{ name = "Antonin Blot", email = "antonin.blot@crick.ac.uk" }]
description = "Python wrapper for the MCMS API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.0",
]

[project.urls]
Homepage = "https://github.com/znamlab/pymcms"
Issues = "https://github.com/znamlab/pymcms/issues"
Source = "https://github.com/znamlab/pymcms"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pymcms*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--cov=pymcms --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pymcms"]

[tool.ruff]
line-length = 88
exclude = ["build", ".eggs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]
